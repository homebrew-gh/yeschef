name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # The signing key lives only in repository secrets. When they're missing
      # (e.g. a fork), the build still runs but is signed with a throwaway debug key.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.YESCHEF_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yeschef.jks"
            echo "YESCHEF_KEYSTORE=$RUNNER_TEMP/yeschef.jks" >> "$GITHUB_ENV"
            echo "Signing with the YesChef key"
          else
            echo "::warning::YESCHEF_KEYSTORE_BASE64 secret not set; APK is signed with a temporary debug key and won't update an installed copy"
          fi

      - name: Unit tests and signed APK
        env:
          YESCHEF_KEYSTORE_PASSWORD: ${{ secrets.YESCHEF_KEYSTORE_PASSWORD }}
          YESCHEF_KEY_ALIAS: ${{ secrets.YESCHEF_KEY_ALIAS }}
          YESCHEF_KEY_PASSWORD: ${{ secrets.YESCHEF_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "yeschef-0.2.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: yeschef-apk
          path: yeschef-*.apk

      # Every build of main becomes a GitHub Release, so the newest APK can be
      # downloaded straight to the phone from the repo's Releases page.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.YESCHEF_KEYSTORE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: YesChef 0.2.${{ github.run_number }}
          body: Built from ${{ github.sha }}. Install over the previous version to update.
          files: yeschef-*.apk
          make_latest: true

  # Publishes each new release to Zapstore (see zapstore/PUBLISHING.md). Uses a
  # delegate Nostr key named in the developer's C1 proof, never the main key.
  # Skipped until the ZAPSTORE_SIGN_WITH secret is set.
  zapstore:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SIGN_WITH: ${{ secrets.ZAPSTORE_SIGN_WITH }}
    steps:
      - name: Check for Zapstore key
        id: key
        run: |
          if [ -n "$SIGN_WITH" ]; then echo "set=true" >> "$GITHUB_OUTPUT"; else echo "ZAPSTORE_SIGN_WITH not set; skipping"; fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.set == 'true'
      - uses: actions/setup-go@v5
        if: steps.key.outputs.set == 'true'
        with:
          go-version: stable
      - name: Publish to Zapstore
        if: steps.key.outputs.set == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          go install github.com/zapstore/zsp/v2/cmd/zsp@v2.0.1
          "$(go env GOPATH)/bin/zsp" publish -q --json

  # Renders the screenshot tests and commits the images to the PR branch,
  # so design changes can be reviewed right on the pull request.
  screenshots:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Record screenshots
        run: ./gradlew --no-daemon recordPaparazziDebug
      - name: Commit screenshots
        run: |
          git add app/src/test/snapshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update screenshots"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: yeschef-screenshots
          path: app/src/test/snapshots/images/*.png
